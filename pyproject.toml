[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comicforge"
version = "0.1.0"
description = "Local comic paneling and layout tool"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "reportlab>=4.0",
    "svglib>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Cairo gives sharper raster output but needs the native Cairo library.
# Skip on Windows unless you have GTK3 Runtime installed.
cairo = ["cairosvg>=2.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["comicforge*"]
